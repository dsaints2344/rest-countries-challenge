<div class="container">
    <div class="row mb-5">
        <div class="d-flex justify-content-between">
            <p-iconField>
                <p-inputIcon styleClass="fa-solid fa-magnifying-glass" />
                <input type="text" pInputText placeholder="Search for a country..." [(ngModel)]="countrySearchInput"
                    (ngModelChange)="handleSearch()" />
            </p-iconField>
            <p-dropdown [options]="regions" [(ngModel)]="selectedRegion" placeholder="Filter by region" showClear="true"
                (ngModelChange)="handleRegionChange()" />
        </div>
    </div>

    <app-countries-list [countries]="filteredCountries" />
</div>
